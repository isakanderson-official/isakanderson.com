name: Daily rebuild

# Rebuilds the site so posts dated today go live at 5am Pacific.
# Cron is UTC only: 12:00 UTC is 5am PDT and 13:00 UTC is 5am PST. The off-season run is a harmless extra deploy.
on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        run: curl -fsS -X POST "$DEPLOY_HOOK"
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
